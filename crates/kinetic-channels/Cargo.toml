[package]
name = "kinetic-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Channel implementations for messaging platform integrations."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
kinetic-api.workspace = true
kinetic-spawn.workspace = true
kinetic-infra.workspace = true
kinetic-config = { workspace = true, default-features = false }
kinetic-log.workspace = true
kinetic-memory.workspace = true
kinetic-providers.workspace = true
kinetic-runtime.workspace = true
kinetic-tool-call-parser.workspace = true
kinetic-tools = { workspace = true, optional = true }
anyhow = "1.0"
lru = "0.18.2"
rumqttc = { version = "0.25", optional = true }
notify = { version = "6", optional = true }
glob = { version = "0.3", optional = true }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "macros",
  "query",
  "tokio",
  "ws",
], optional = true }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
directories = "6.0"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
] }
hmac = "0.12"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
], optional = true }
pulldown-cmark = "0.13"
parking_lot = "0.12"
portable-atomic = "1"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "multipart",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
], optional = true }
tokio-util = { version = "0.7", default-features = false }
toml = "1.0"
urlencoding = "2.1"
url = "2.5"
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }
hex = "0.4"
nanohtml2text = "0.2"
rand = "0.10"
webpki-roots = { version = "1.0.6", optional = true }

cpal = { version = "0.18.1", optional = true }
shellexpand = "3.1"

[features]
default = ["default-channels"]
test-util = []
default-channels = [
  "channel-acp-server",
  "channel-filesystem",
  "channel-mqtt",
  "channel-telegram",
  "channel-webhook",
]
tls-client = ["dep:tokio-rustls", "dep:webpki-roots"]
ws-transport = ["kinetic-config/ws-transport", "dep:tokio-tungstenite"]
image-normalization = ["dep:image"]
channel-telegram = ["image-normalization"]
channel-mqtt = ["dep:rumqttc"]
channel-filesystem = ["dep:notify", "dep:glob"]
channel-webhook = ["dep:axum"]
channel-acp-server = ["dep:kinetic-tools"]
voice-wake = ["dep:cpal"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Enables the runtime crate's test-only `ScopedToolRegistry::from_raw_for_test`
# so channel test fixtures can mint the now-sealed `ChannelRuntimeContext`
# tools registry. dev-dependency only: never enabled in the shipped channels lib.
kinetic-runtime = { workspace = true, features = ["test-util"] }
kinetic-tools.workspace = true
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tempfile = "3.26"
toml = "1.0"
wiremock = "0.6"
# `test-util` is what `#[tokio::test(start_paused = true)]` needs, so a
# duration-sensitive regression can assert the deadline the channel actually
# waits without the suite sleeping for it. Dev-only, and the same feature
# kinetic-providers already carries for the same reason.
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "test-util"] }
