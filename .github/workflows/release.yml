name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: agent-runtime,channel-telegram,hardware,peripheral-rpi
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            features: agent-runtime,channel-telegram,hardware,peripheral-rpi
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            features: agent-runtime,channel-telegram,hardware
          - os: macos-14
            target: x86_64-apple-darwin
            features: agent-runtime,channel-telegram,hardware
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev
      - name: aarch64 cross compiler
        if: matrix.cross
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --profile ci --locked --target "${{ matrix.target }}" \
            --no-default-features --features "${{ matrix.features }}"
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/ci/kinetic" dist/kinetic
          tar -C dist -czf "kinetic-${{ matrix.target }}.tar.gz" kinetic
      - uses: actions/upload-artifact@v4
        with:
          name: kinetic-${{ matrix.target }}
          path: kinetic-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kinetic-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum kinetic-*.tar.gz > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="Install with: curl -fsSL https://raw.githubusercontent.com/tsmboa0/kinetic-vm/main/install.sh | sh"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes "$notes"
          fi
